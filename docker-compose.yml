services:
  # Target 1: Nginx (Web Server)
  target-nginx:
    image: nginx:alpine
    container_name: target-nginx
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.10
        mac_address: 02:42:ac:1c:00:0a

  # Target 2: Redis (In-memory DB / Cache)
  target-redis:
    image: redis:alpine
    container_name: target-redis
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.20
        mac_address: 02:42:ac:1c:00:14

  # Target 3: DVWA (Damn Vulnerable Web App - Port 80)
  target-dvwa:
    image: vulnerables/web-dvwa
    container_name: target-dvwa
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.30
        mac_address: 02:42:ac:1c:00:1e

  # Target 4: Vulnerable FTP / Anonymous Access (vsftpd)
  target-ftp:
    image: fauria/vsftpd
    container_name: target-ftp
    environment:
      FTP_USER: admin
      FTP_PASS: admin123
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.40
        mac_address: 02:42:ac:1c:00:28

  # Target 5: Metasploitable Web / Juice Shop (OWASP Top 10)
  target-juiceshop:
    image: bkimminich/juice-shop:v15.0.0
    container_name: target-juiceshop
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.50
        mac_address: 02:42:ac:1c:00:32

  # Target 6: Outdated Vulnerable SSH Service
  target-ssh:
    image: hermsi/alpine-sshd:latest
    container_name: target-ssh
    environment:
      ROOT_PASSWORD: root
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.60
        mac_address: 02:42:ac:1c:00:3c

  # Target 7: Vulnerable Log4j App (CVE-2021-44228)
  target-log4j:
    image: ghcr.io/christophetd/log4shell-vulnerable-app:latest
    container_name: target-log4j
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.70
        mac_address: 02:42:ac:1c:00:46

  # Dynamic Environment Controller (Rotates 2 targets ON for 2 minutes, then takes them OFF)
  environment-orchestrator:
    image: docker:cli
    container_name: dynamic-orchestrator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "
      echo '[Orchestrator] Initializing cycle manager...';
      FLAPPING_POOL='target-ftp target-juiceshop target-ssh target-log4j target-redis';
      
      # Stop all dynamic target devices initially
      docker stop $$FLAPPING_POOL 2>/dev/null || true;

      while true; do
        # Select 2 distinct targets randomly
        TARGETS_TO_UP=$$(echo $$FLAPPING_POOL | tr ' ' '\n' | shuf -n 2 | tr '\n' ' ');
        
        echo \"[Orchestrator] Starting targets for 2 minutes: $$TARGETS_TO_UP\";
        docker start $$TARGETS_TO_UP 2>/dev/null || true;
        
        # Keep targets UP for exactly 2 minutes (120 seconds)
        sleep 120;
        
        echo \"[Orchestrator] Bringing targets DOWN: $$TARGETS_TO_UP\";
        docker stop $$TARGETS_TO_UP 2>/dev/null || true;
        
        # Brief 10-second gap before the next rotation cycle
        sleep 10;
      done
      "
    restart: always

  # Traffic & Probe Generator (Generates active ARP, TCP, and HTTP probes)
  traffic-generator:
    image: alpine:latest
    container_name: traffic-generator
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.99
        mac_address: 02:42:ac:1c:00:63
    command: >
      sh -c "
      apk add --no-cache curl bind-tools nmap-ncat;
      while true; do
        curl -s http://172.28.0.10 >/dev/null || true;
        curl -s http://172.28.0.30 >/dev/null || true;
        curl -s http://172.28.0.50 >/dev/null || true;
        nc -zv -w 1 172.28.0.40 21 >/dev/null 2>&1 || true;
        nc -zv -w 1 172.28.0.60 22 >/dev/null 2>&1 || true;
        nc -zv -w 1 172.28.0.70 8080 >/dev/null 2>&1 || true;
        sleep 5;
      done
      "
    restart: always

  # Sentinel Telemetry & Discovery Engine
  sentinel:
    build: .
    container_name: cerberus-sentinel
    ports:
      - "8080:8080"
    environment:
      - CERBERUS_PORT=8080
      - CERBERUS_SUBNET=172.28.0.0/24
      - CERBERUS_DISCOVERY_INTERVAL=1m
      - CERBERUS_VULN_INTERVAL=2m
      - CERBERUS_UNPRIVILEGED=false
      - CERBERUS_MOCK_DATA=false
      - CERBERUS_SCAN_PORTS=--top-ports 2000
    volumes:
      - sentinel-data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.5
        mac_address: 02:42:ac:1c:00:05
    depends_on:
      - target-nginx
      - target-redis
      - target-dvwa
      - target-ftp
      - target-juiceshop
      - target-ssh
      - target-log4j

networks:
  sentinel-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes:
  sentinel-data:
