name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact_name: Cerberus-macOS-universal.dmg
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact_name: cerberus-sentinel-linux-amd64.deb
          - os: windows-latest
            platform: windows/amd64
            artifact_name: Cerberus-Windows-amd64-installer.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Cerberus Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Release Version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # Strip leading 'v'
          PLAIN_VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PLAIN_VERSION=${PLAIN_VERSION}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential nsis

      - name: Install Windows NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Install Wails CLI
        shell: bash
        run: |
          # Keep in sync with github.com/wailsapp/wails/v2 in go.mod.
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Frontend (CerberusFront)
        shell: bash
        run: |
          if [ -d "front" ] && [ -f "front/package.json" ]; then
            cd front
            npm ci || npm install
            npm run build
            cd ..
            rm -rf desktop/frontend/dist
            mkdir -p desktop/frontend/dist
            cp -R front/dist/. desktop/frontend/dist/
          elif [ -f "desktop/frontend/dist/index.html" ]; then
            echo "Pre-built frontend assets present in desktop/frontend/dist"
          fi

      - name: Build macOS Application (.app & .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop
          wails build -platform ${{ matrix.platform }} -clean
          chmod +x packaging/darwin/build-dmg.sh
          ./packaging/darwin/build-dmg.sh "../${{ matrix.artifact_name }}"

      - name: Build Linux Application (.deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd desktop
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -clean
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh "${PLAIN_VERSION}" "../${{ matrix.artifact_name }}"

      - name: Build Windows Application (NSIS Installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd desktop
          wails build -platform ${{ matrix.platform }} -nsis -clean
          ls -la build/bin/
          if ls build/bin/*installer.exe 1> /dev/null 2>&1; then
            cp build/bin/*installer.exe ../${{ matrix.artifact_name }}
          elif ls build/bin/*.exe 1> /dev/null 2>&1; then
            cp build/bin/*.exe ../${{ matrix.artifact_name }}
          else
            echo "Error: no windows executable found in build/bin/"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cerberus Sentinel ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_artifacts/*
