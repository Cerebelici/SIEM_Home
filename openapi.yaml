openapi: 3.0.3
info:
  title: Cerberus Network Sentinel API
  version: 1.0.0
  description: >
    # Welcome to the Cerberus Network Sentinel API


    Cerberus Sentinel is an automated network security auditing and asset
    inventory daemon built in Go. It continuously monitors network subnets,
    profiles active devices and transport services, correlates banner metadata with
    known Common Vulnerabilities and Exposures (CVEs), and exposes real-time
    telemetry through a RESTful JSON interface.


    ### How this documentation works


    This API reference is automatically generated from the OpenAPI specification
    uploaded to GitBook. GitBook parses the schema to render interactive endpoint
    explorers, schema definitions, and executable code samples.


    Key architectural features of this API:


    - **Page groups** — Tags are organized into hierarchical sections (*Inventory*,
    *Vulnerability Analysis*, *Scan Controls*, and *System Telemetry*), keeping related
    endpoints naturally structured.

    - **Auto-split sections** — `##` headings inside `info.description` are
    automatically partitioned into distinct subpages in the sidebar navigation.

    - **Reactive & Scheduled Operations** — The sentinel coordinates background
    goroutines (30-minute discovery sweeps, 10-minute vulnerability audits) as well
    as immediate on-demand scans.

    - **Interactive Code Samples** — Every endpoint features hand-crafted code
    snippets in cURL, JavaScript (Fetch), and Python (requests) via `x-codeSamples`.

    - **Live Testing Panel** — Try endpoints directly within your browser against your
    local daemon or containerized sentinel instance.


    ## Servers & Network Topology


    ### Servers


    {% tabs %}

    {% tab title="Local Daemon" %}

    **Base URL**

    `http://localhost:8080`

    {% endtab %}


    {% tab title="Docker Container" %}

    **Base URL**

    `http://172.28.0.5:8080`

    {% endtab %}

    {% tab title="Custom Host" %}

    **Base URL**

    `http://sentinel.local:8080`

    {% endtab %}

    {% endtabs %}


    {% hint style="info" %}

    Use the server switcher in the top-right of the **Try it** panel on each
    endpoint page to target your desired sentinel runtime environment.

    {% endhint %}


    ## Getting Started


    {% stepper %}

    {% step %}

    ## Verify Service Health

    Issue a request to `GET /health` or `GET /api/status` to ensure the sentinel
    daemon is active and background schedulers are operational.

    {% endstep %}


    {% step %}

    ## Trigger a Subnet Discovery Sweep

    Dispatch a `POST /api/scans/discovery/trigger` request to launch an immediate
    background sweep across your configured network CIDR (e.g. `172.28.0.0/24`).

    {% endstep %}


    {% step %}

    ## Query Live Inventory & CVEs

    Retrieve the discovered hosts via `GET /api/devices` or inspect correlated
    vulnerabilities using `GET /api/vulnerabilities?severity=CRITICAL`.

    {% endstep %}

    {% endstepper %}


    ## Error Responses


    All error responses conform to a unified JSON schema:


    ```json

    {
      "error": "Detailed description of the error condition"
    }

    ```


    | Status Code | Meaning | Resolution |

    |---|---|---|

    | `400 Bad Request` | Invalid query or path parameter | Verify parameter types (e.g. integer device ID). |

    | `404 Not Found` | Requested device or entity not found | Confirm entity identifier via `GET /api/devices`. |

    | `500 Internal Error` | Storage or probe execution failure | Check container logs or SQLite database file permissions. |


    {% hint style="warning" %}

    Active vulnerability scans invoke Nmap with NSE scripts against target devices. Ensure
    the sentinel is only executed against authorized networks or isolated testing testbeds.

    {% endhint %}
servers:
  - url: http://localhost:8080
    description: Localhost Daemon
  - url: http://172.28.0.5:8080
    description: Docker Bridge (sentinel-net)
