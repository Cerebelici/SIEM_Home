paths:
  /api/status:
    get:
      summary: Retrieve system telemetry and status
      description: >
        Returns real-time runtime metrics for the Cerberus daemon, including
        process uptime, aggregated asset counts, current scheduler running states,
        and timestamps for the next planned discovery and vulnerability sweeps.
      tags:
        - system
      operationId: getSystemStatus
      responses:
        '200':
          description: Live sentinel health and scheduler metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                uptime: 1h42m15s
                uptime_seconds: 6135
                active_devices: 5
                total_devices: 5
                total_services: 8
                total_vulnerabilities: 102
                discovery_next_run: '2026-09-25T12:00:00Z'
                vuln_next_run: '2026-09-25T11:50:00Z'
                is_discovery_running: false
                is_vuln_running: false
                capabilities:
                  nmap_path: /usr/bin/nmap
                  nmap_version: "7.94"
                  vuln_script_ok: true
                  raw_socket: true
                  effective_mode: privileged
                  warnings: []
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L http://localhost:8080/api/status
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/status');
            const status = await res.json();
            console.log(status);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/status')
            print(r.json())

  /api/devices:
    get:
      summary: List tracked network devices
      description: >
        Returns all discovered network endpoints tracked in the SQLite repository.
        Supports filtering by operational liveness status (`up` or `down`). Each
        device summary contains aggregated counts of open services and confirmed
        vulnerabilities.
      tags:
        - devices
      operationId: listDevices
      parameters:
        - name: status
          in: query
          required: false
          description: Filter devices by liveness state.
          schema:
            type: string
            enum: [up, down]
          example: up
      responses:
        '200':
          description: A list of tracked devices and summary count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
              example:
                count: 2
                devices:
                  - id: 1
                    ip: 172.28.0.10
                    mac: 02:42:AC:1C:00:0A
                    hostname: target-nginx
                    vendor: Docker Network
                    status: up
                    first_seen: '2026-09-25T10:00:00Z'
                    last_seen: '2026-09-25T11:30:00Z'
                    services_count: 1
                    vulnerabilities_count: 0
                  - id: 2
                    ip: 172.28.0.30
                    mac: 02:42:AC:1C:00:1E
                    hostname: target-dvwa
                    vendor: Docker Network
                    status: up
                    first_seen: '2026-09-25T10:00:00Z'
                    last_seen: '2026-09-25T11:30:00Z'
                    services_count: 1
                    vulnerabilities_count: 102
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L "http://localhost:8080/api/devices?status=up"
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/devices?status=up');
            const data = await res.json();
            console.log(data.devices);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/devices', params={'status': 'up'})
            print(r.json())

  /api/devices/{id}:
    get:
      summary: Retrieve detailed device profile
      description: >
        Fetches complete forensic details for a single host by its numeric identifier,
        including all identified transport-layer ports, application banners, and
        correlated CVE security vulnerabilities.
      tags:
        - devices
      operationId: getDeviceById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique integer ID of the device.
          schema:
            type: integer
            format: int64
          example: 2
      responses:
        '200':
          description: Full device entity with nested services and vulnerabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: 2
                ip: 172.28.0.30
                mac: 02:42:AC:1C:00:1E
                hostname: target-dvwa
                vendor: Docker Network
                status: up
                first_seen: '2026-09-25T10:00:00Z'
                last_seen: '2026-09-25T11:30:00Z'
                services_count: 1
                vulnerabilities_count: 1
                services:
                  - id: 1
                    device_id: 2
                    device_ip: 172.28.0.30
                    port: 80
                    protocol: tcp
                    service_name: http
                    product: Apache httpd
                    version: 2.4.25
                    state: open
                    updated_at: '2026-09-25T11:30:00Z'
                vulnerabilities:
                  - id: 1
                    device_id: 2
                    device_ip: 172.28.0.30
                    service_port: 80
                    cve_id: CVE-2026-44631
                    title: Vulnerability CVE-2026-44631 on port 80
                    severity: CRITICAL
                    cvss_score: 9.8
                    description: Identified via vulners script
                    reference_url: https://vulners.com/cve/CVE-2026-44631
                    detected_at: '2026-09-25T11:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L http://localhost:8080/api/devices/2
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/devices/2');
            const device = await res.json();
            console.log(device);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/devices/2')
            print(r.json())

  /api/services:
    get:
      summary: List all active network services
      description: >
        Returns an aggregated inventory of all application services and listening
        sockets discovered across the entire monitored network infrastructure.
      tags:
        - services
      operationId: listServices
      responses:
        '200':
          description: List of all open services across endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
              example:
                count: 2
                services:
                  - id: 1
                    device_id: 1
                    device_ip: 172.28.0.10
                    port: 80
                    protocol: tcp
                    service_name: http
                    product: nginx
                    version: 1.21.6
                    state: open
                    updated_at: '2026-09-25T11:00:00Z'
                  - id: 2
                    device_id: 2
                    device_ip: 172.28.0.20
                    port: 6379
                    protocol: tcp
                    service_name: redis
                    product: Redis key-value store
                    version: 7.0.0
                    state: open
                    updated_at: '2026-09-25T11:00:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L http://localhost:8080/api/services
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/services');
            const data = await res.json();
            console.log(data.services);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/services')
            print(r.json())

  /api/vulnerabilities:
    get:
      summary: List identified CVE vulnerabilities
      description: >
        Returns all security vulnerabilities correlated against discovered services.
        Supports filtering by severity tier (`CRITICAL`, `HIGH`, `MEDIUM`, `LOW`, `UNKNOWN`).
      tags:
        - vulnerabilities
      operationId: listVulnerabilities
      parameters:
        - name: severity
          in: query
          required: false
          description: Filter CVE findings by normalized severity rating.
          schema:
            $ref: '#/components/schemas/VulnerabilitySeverity'
          example: CRITICAL
      responses:
        '200':
          description: A list of detected vulnerabilities and total count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilityListResponse'
              example:
                count: 1
                vulnerabilities:
                  - id: 1
                    device_id: 2
                    device_ip: 172.28.0.30
                    service_port: 80
                    cve_id: CVE-2026-44631
                    title: Vulnerability CVE-2026-44631 on port 80
                    severity: CRITICAL
                    cvss_score: 9.8
                    description: Identified via vulners script
                    reference_url: https://vulners.com/cve/CVE-2026-44631
                    detected_at: '2026-09-25T11:30:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L "http://localhost:8080/api/vulnerabilities?severity=CRITICAL"
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/vulnerabilities?severity=CRITICAL');
            const data = await res.json();
            console.log(data.vulnerabilities);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/vulnerabilities', params={'severity': 'CRITICAL'})
            print(r.json())

  /api/scans:
    get:
      summary: List historical scan audit records
      description: >
        Returns historical execution logs for discovery, periodic vulnerability audits,
        and immediate reactive scan routines. Includes target specifications, execution
        duration in milliseconds, and discovered entity metrics.
      tags:
        - scans
      operationId: listScans
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of recent scan logs to return (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          example: 20
      responses:
        '200':
          description: List of execution audit records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanListResponse'
              example:
                count: 2
                scans:
                  - id: 1
                    scan_type: discovery
                    status: completed
                    target_spec: 172.28.0.0/24
                    hosts_found: 5
                    vulns_found: 0
                    duration_ms: 1982
                    started_at: '2026-09-25T11:00:00Z'
                    completed_at: '2026-09-25T11:00:02Z'
                  - id: 2
                    scan_type: immediate
                    status: completed
                    target_spec: '[172.28.0.30]'
                    hosts_found: 1
                    vulns_found: 102
                    duration_ms: 6491
                    started_at: '2026-09-25T11:00:02Z'
                    completed_at: '2026-09-25T11:00:08Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L "http://localhost:8080/api/scans?limit=20"
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/scans?limit=20');
            const data = await res.json();
            console.log(data.scans);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/scans', params={'limit': 20})
            print(r.json())

  /api/timeline:
    get:
      summary: Retrieve device activity periods and scan line ticks
      description: >
        Returns time-series scan execution ticks alongside segmented continuous activity
        periods for all tracked devices. Activity periods automatically segment across
        liveness transitions (up <-> down) and vulnerability posture changes (severity shifts),
        enabling direct rendering of interactive Gantt-style timeline graphs and scan lines.
      tags:
        - timeline
      operationId: getTimeline
      parameters:
        - name: from
          in: query
          required: false
          description: RFC3339 timestamp or duration (e.g. 24h, 7d) defining the start of the time window. Defaults to 24 hours ago.
          schema:
            type: string
            example: "2026-09-30T06:00:00Z"
        - name: to
          in: query
          required: false
          description: RFC3339 timestamp defining the end of the time window. Defaults to current timestamp.
          schema:
            type: string
            example: "2026-09-30T12:00:00Z"
        - name: status
          in: query
          required: false
          description: Filter devices by their current status.
          schema:
            type: string
            enum: [up, down]
        - name: vulnerable_only
          in: query
          required: false
          description: If true, filters response to include only devices with detected vulnerabilities during the time window.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Timeline dataset containing scan ticks and device activity periods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L "http://localhost:8080/api/timeline?from=24h&vulnerable_only=false"
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/timeline?from=24h');
            const data = await res.json();
            console.log(data.devices, data.scan_ticks);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/timeline', params={'from': '24h'})
            print(r.json())

  /api/scans/discovery/trigger:
    post:
      summary: Trigger on-demand subnet discovery
      description: >
        Asynchronously initiates an immediate host discovery sweep across the configured
        network subnet (`CERBERUS_SUBNET`). Returns immediately with HTTP 202 Accepted.
        Newly detected endpoints are automatically queued for immediate vulnerability auditing.
      tags:
        - scans
      operationId: triggerDiscoveryScan
      responses:
        '202':
          description: Discovery scan task dispatched to background worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTriggerResponse'
              example:
                message: Discovery scan initiated in background
                status: running
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L -X POST http://localhost:8080/api/scans/discovery/trigger
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/scans/discovery/trigger', {
              method: 'POST'
            });
            const data = await res.json();
            console.log(data);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.post('http://localhost:8080/api/scans/discovery/trigger')
            print(r.json())

  /api/scans/vulnerability/trigger:
    post:
      summary: Trigger on-demand vulnerability audit
      description: >
        Asynchronously initiates an immediate vulnerability assessment sweep across
        all active endpoints currently registered in the database. Returns immediately
        with HTTP 202 Accepted.
      tags:
        - scans
      operationId: triggerVulnerabilityScan
      responses:
        '202':
          description: Vulnerability audit task dispatched to background worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTriggerResponse'
              example:
                message: Vulnerability audit initiated in background
                status: running
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L -X POST http://localhost:8080/api/scans/vulnerability/trigger
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/scans/vulnerability/trigger', {
              method: 'POST'
            });
            const data = await res.json();
            console.log(data);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.post('http://localhost:8080/api/scans/vulnerability/trigger')
            print(r.json())

  /api/export/json:
    get:
      summary: Export complete network inventory snapshot
      description: >
        Emits a consolidated, structured JSON export document containing all tracked
        network devices, their active services, and all correlated CVE vulnerability findings.
        Supplied with a downloadable attachment header (`Content-Disposition`).
      tags:
        - system
      operationId: exportAllData
      responses:
        '200':
          description: Complete serialized inventory snapshot.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="cerberus-export-20260925-115500.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-hideTryItPanel: false
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L -O -J http://localhost:8080/api/export/json
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/api/export/json');
            const backup = await res.json();
            console.log(`Total devices: ${backup.total_devices}`);
        - lang: Python
          label: Python
          source: |
            import requests
            r = requests.get('http://localhost:8080/api/export/json')
            with open('cerberus_export.json', 'w') as f:
                f.write(r.text)

  /health:
    get:
      summary: Liveness health check probe
      description: Basic HTTP liveness endpoint intended for container health probes and load balancer checks.
      tags:
        - system
      operationId: getHealth
      responses:
        '200':
          description: Service is operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
      x-codeSamples:
        - lang: cURL
          label: CLI
          source: |
            curl -L http://localhost:8080/health
        - lang: JavaScript
          label: Fetch
          source: |
            const res = await fetch('http://localhost:8080/health');
            console.log(await res.json());
        - lang: Python
          label: Python
          source: |
            import requests
            print(requests.get('http://localhost:8080/health').json())

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - ip
        - status
        - first_seen
        - last_seen
      properties:
        id:
          type: integer
          format: int64
          description: Unique surrogate identifier for the device.
          example: 1
        ip:
          type: string
          description: IPv4 or IPv6 address.
          example: 172.28.0.10
        mac:
          type: string
          description: Physical MAC hardware address.
          example: 02:42:AC:1C:00:0A
        hostname:
          type: string
          description: Resolved PTR or NetBIOS hostname.
          example: target-nginx
        vendor:
          type: string
          description: Hardware manufacturer inferred from MAC OUI prefix.
          example: Docker Network
        status:
          type: string
          enum: [up, down]
          description: Operational liveness state.
          example: up
        first_seen:
          type: string
          format: date-time
          description: Initial discovery timestamp.
        last_seen:
          type: string
          format: date-time
          description: Most recent active response timestamp.
        services_count:
          type: integer
          description: Number of open services detected on the host.
          example: 1
        vulnerabilities_count:
          type: integer
          description: Number of vulnerabilities correlated with the host.
          example: 0
        services:
          type: array
          description: Detailed list of active services (included on detail queries).
          items:
            $ref: '#/components/schemas/Service'
        vulnerabilities:
          type: array
          description: Detailed list of correlated vulnerabilities (included on detail queries).
          items:
            $ref: '#/components/schemas/Vulnerability'

    DeviceListResponse:
      type: object
      required:
        - count
        - devices
      properties:
        count:
          type: integer
          description: Total number of devices matching the query.
          example: 5
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    Service:
      type: object
      required:
        - id
        - device_id
        - port
        - protocol
        - state
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique service record identifier.
          example: 1
        device_id:
          type: integer
          format: int64
          description: Parent device foreign key identifier.
          example: 2
        device_ip:
          type: string
          description: IP address of the parent device.
          example: 172.28.0.30
        port:
          type: integer
          description: Transport-layer port number.
          example: 80
        protocol:
          type: string
          enum: [tcp, udp]
          description: Layer-4 transport protocol.
          example: tcp
        service_name:
          type: string
          description: Canonical service name.
          example: http
        product:
          type: string
          description: Interrogated software application name.
          example: Apache httpd
        version:
          type: string
          description: Interrogated software version string.
          example: 2.4.25
        state:
          type: string
          enum: [open, filtered, closed]
          description: Network socket state.
          example: open
        updated_at:
          type: string
          format: date-time
          description: Timestamp of most recent service interrogation.
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/Vulnerability'

    ServiceListResponse:
      type: object
      required:
        - count
        - services
      properties:
        count:
          type: integer
          description: Total number of active services detected across all endpoints.
          example: 2
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'

    VulnerabilitySeverity:
      type: string
      enum:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
        - UNKNOWN
      x-enumDescriptions:
        CRITICAL: CVSS score >= 9.0. Exploitation allows remote code execution or complete system takeover.
        HIGH: CVSS score between 7.0 and 8.9. Severe vulnerabilities requiring urgent mitigation.
        MEDIUM: CVSS score between 4.0 and 6.9. Moderately complex or constrained vulnerabilities.
        LOW: CVSS score between 0.1 and 3.9. Minor information disclosures or low-impact weaknesses.
        UNKNOWN: Informational or unrated security advisory.

    Vulnerability:
      type: object
      required:
        - id
        - device_id
        - service_port
        - cve_id
        - severity
        - cvss_score
        - detected_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique vulnerability record identifier.
          example: 1
        device_id:
          type: integer
          format: int64
          description: Affected device foreign key identifier.
          example: 2
        device_ip:
          type: string
          description: IP address of the affected device.
          example: 172.28.0.30
        service_port:
          type: integer
          description: Open port number through which the vulnerability is exposed.
          example: 80
        cve_id:
          type: string
          description: Standard CVE vulnerability identifier.
          example: CVE-2026-44631
        title:
          type: string
          description: Summary headline of the vulnerability.
          example: Vulnerability CVE-2026-44631 on port 80
        severity:
          $ref: '#/components/schemas/VulnerabilitySeverity'
        cvss_score:
          type: number
          format: double
          description: CVSS v3.x numerical base score (0.0 to 10.0).
          example: 9.8
        description:
          type: string
          description: Technical summary of the vulnerability.
          example: Identified via vulners script
        reference_url:
          type: string
          format: uri
          description: Link to authoritative NIST NVD or Vulners security advisory.
          example: https://vulners.com/cve/CVE-2026-44631
        detected_at:
          type: string
          format: date-time
          description: Initial detection timestamp.
        is_exploit:
          type: boolean
          description: Whether an exploit is known or available for this vulnerability.
          example: false
        exploit_refs:
          type: array
          items:
            type: string
          description: Exploit database identifiers (e.g. EDB-ID, PacketStorm).
          example: ["EDB-ID:50000"]
        status:
          type: string
          enum: [open, resolved]
          description: Current lifecycle status of the vulnerability finding.
          example: open
        first_detected_at:
          type: string
          format: date-time
          description: Timestamp when the vulnerability was first observed.
        last_seen_at:
          type: string
          format: date-time
          description: Timestamp when the vulnerability was most recently verified.
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the vulnerability was remediated or no longer detected.

    VulnerabilityListResponse:
      type: object
      required:
        - count
        - vulnerabilities
      properties:
        count:
          type: integer
          description: Total number of vulnerabilities matching the criteria.
          example: 102
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/Vulnerability'

    ScanLog:
      type: object
      required:
        - id
        - scan_type
        - status
        - target_spec
        - hosts_found
        - vulns_found
        - duration_ms
        - started_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique scan execution identifier.
          example: 1
        scan_type:
          type: string
          enum: [discovery, vulnerability, immediate]
          description: Execution mode of the scan job.
          example: discovery
        status:
          type: string
          enum: [running, completed, failed]
          description: Current execution status.
          example: completed
        target_spec:
          type: string
          description: Network CIDR or IP target list scanned.
          example: 172.28.0.0/24
        hosts_found:
          type: integer
          description: Count of live hosts detected during this run.
          example: 5
        vulns_found:
          type: integer
          description: Count of vulnerabilities detected during this run.
          example: 0
        duration_ms:
          type: integer
          format: int64
          description: Total scan duration in milliseconds.
          example: 1982
        error_message:
          type: string
          description: Error details if status is failed.
          example: ''
        started_at:
          type: string
          format: date-time
          description: Execution start timestamp.
        completed_at:
          type: string
          format: date-time
          description: Execution completion timestamp.

    ScanListResponse:
      type: object
      required:
        - count
        - scans
      properties:
        count:
          type: integer
          description: Number of scan records returned.
          example: 2
        scans:
          type: array
          items:
            $ref: '#/components/schemas/ScanLog'

    SystemStatus:
      type: object
      required:
        - uptime
        - uptime_seconds
        - active_devices
        - total_devices
        - total_services
        - total_vulnerabilities
        - is_discovery_running
        - is_vuln_running
        - capabilities
      properties:
        uptime:
          type: string
          description: Human-readable daemon uptime duration.
          example: 1h42m15s
        uptime_seconds:
          type: integer
          format: int64
          description: Total uptime in seconds.
          example: 6135
        active_devices:
          type: integer
          description: Total count of devices currently marked as up.
          example: 5
        total_devices:
          type: integer
          description: Total count of historical devices in database.
          example: 5
        total_services:
          type: integer
          description: Total count of active services identified.
          example: 8
        total_vulnerabilities:
          type: integer
          description: Total count of active vulnerabilities across all hosts.
          example: 102
        discovery_next_run:
          type: string
          format: date-time
          description: Next planned discovery sweep timestamp.
        vuln_next_run:
          type: string
          format: date-time
          description: Next planned bulk vulnerability audit timestamp.
        is_discovery_running:
          type: boolean
          description: True if a subnet discovery sweep is currently executing.
          example: false
        is_vuln_running:
          type: boolean
          description: True if a vulnerability audit sweep is currently executing.
          example: false
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    Capabilities:
      type: object
      required:
        - nmap_path
        - nmap_version
        - vuln_script_ok
        - raw_socket
        - effective_mode
      properties:
        nmap_path:
          type: string
          example: /usr/bin/nmap
        nmap_version:
          type: string
          example: "7.94"
        vuln_script_ok:
          type: boolean
          example: true
        raw_socket:
          type: boolean
          example: true
        effective_mode:
          type: string
          enum: [privileged, unprivileged]
          example: privileged
        warnings:
          type: array
          items:
            type: string
          example: []

    ScanTriggerResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Informational status message.
          example: Discovery scan initiated in background
        status:
          type: string
          description: Execution state.
          example: running

    ExportData:
      type: object
      required:
        - exported_at
        - network_cidr
        - total_devices
        - total_vulnerabilities
        - devices
      properties:
        exported_at:
          type: string
          format: date-time
          description: Timestamp when snapshot was exported.
        network_cidr:
          type: string
          description: Configured network CIDR.
          example: 172.28.0.0/24
        total_devices:
          type: integer
          description: Number of exported devices.
          example: 5
        total_vulnerabilities:
          type: integer
          description: Number of exported vulnerabilities.
          example: 102
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    TimelineResponse:
      type: object
      required:
        - time_window
        - scan_ticks
        - devices
      properties:
        time_window:
          $ref: '#/components/schemas/TimelineTimeWindow'
        scan_ticks:
          type: array
          items:
            $ref: '#/components/schemas/ScanTick'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/TimelineDevice'

    TimelineTimeWindow:
      type: object
      required:
        - from
        - to
        - total_scans
        - total_devices
      properties:
        from:
          type: string
          format: date-time
          example: "2026-09-30T06:00:00Z"
        to:
          type: string
          format: date-time
          example: "2026-09-30T12:00:00Z"
        total_scans:
          type: integer
          example: 7
        total_devices:
          type: integer
          example: 4

    ScanTick:
      type: object
      required:
        - scan_id
        - timestamp
        - scan_type
        - status
      properties:
        scan_id:
          type: integer
          example: 101
        timestamp:
          type: string
          format: date-time
          example: "2026-09-30T06:00:00Z"
        scan_type:
          type: string
          example: discovery
        status:
          type: string
          example: completed
        target_spec:
          type: string
          example: "172.28.0.0/24"
        hosts_found:
          type: integer
          example: 3
        duration_ms:
          type: integer
          example: 1420

    TimelineDevice:
      type: object
      required:
        - device_id
        - ip
        - current_status
        - periods
      properties:
        device_id:
          type: integer
          example: 2
        ip:
          type: string
          example: "172.28.0.20"
        mac:
          type: string
          example: "02:42:AC:1C:00:14"
        hostname:
          type: string
          example: target-nginx
        vendor:
          type: string
          example: Docker Inc.
        current_status:
          type: string
          example: up
        periods:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePeriod'

    TimelinePeriod:
      type: object
      required:
        - started_at
        - ended_at
        - status
        - is_vulnerable
        - vulns_count
        - max_severity
        - is_ongoing
      properties:
        started_at:
          type: string
          format: date-time
          example: "2026-09-30T08:10:00Z"
        ended_at:
          type: string
          format: date-time
          example: "2026-09-30T12:00:00Z"
        status:
          type: string
          example: up
        is_vulnerable:
          type: boolean
          example: true
        vulns_count:
          type: integer
          example: 2
        max_severity:
          type: string
          example: HIGH
        is_ongoing:
          type: boolean
          example: true
        transition_uncertainty_s:
          type: integer
          format: int64
          description: Time gap in seconds between the end of the previous sample and the start of the next sample during state transitions.
          example: 300

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Description of the error that occurred.
          example: device 42 not found

  responses:
    BadRequest:
      description: The request contains invalid parameters or malformed identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid device id
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: device 99 not found
    InternalServerError:
      description: The server encountered an unexpected error processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: database operation failed

